<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>Hors connexion — Factumation</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #334155;
        font-family: Arial, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 440px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #fff;
        padding: 32px;
        text-align: center;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        margin: auto;
        border-radius: 12px;
        background: #1e3a8a;
        color: #fff;
        font-weight: 700;
      }
      h1 {
        color: #0f172a;
        font-size: 24px;
        margin: 20px 0 8px;
      }
      p {
        line-height: 1.6;
        margin: 0;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 8px;
        background: #1e3a8a;
        color: #fff;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">F</div>
      <h1>Vous êtes hors connexion</h1>
      <p>
        Les données de facturation restent privées et ne sont pas mises en cache. Reconnectez-vous
        pour continuer.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
